<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/logindoador.css">
    
    <title>Login — Unidoar</title>
</head>
<body>

<header>
    <div class="background-header">
        <nav class="navegacao">
            <div class="logo">
                <a href="index1.html">UNIDOAR</a>
            </div>
            <ul class="ul">
               <li><a href="sobre1.html" class="menu-link">Sobre</a></li>
                <li><a href="contactos.html" class="menu-link">Contactos</a></li>
                <li><a href="suporte.html" class="menu-link">Suporte</a></li>
                
            </ul>
        </nav>
    </div>
</header>

<main class="pagina-login">
    <div class="login-card">
        <h1>Iniciar sessão</h1>
        <p class="login-sub">Acede à tua conta para continuar a ajudar.</p>

        <form action="#" method="POST" class="form-login">
            <div class="campo-formulario">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="o.teu@email.com" class="campo-form" required>
            </div>

            <div class="campo-formulario">
                <label for="senha">Palavra-passe</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" class="campo-form" required>
            </div>

            <button type="submit" class="btn-sobre btn-doador">Entrar</button>
        </form>

        <p class="login-mensagem">
            Caso não tenha conta, <a href="cadastrodoador.html">cadastre-se</a>.
        </p>
    </div>
</main>

<footer>
    <p>© Unidoar — Plataforma de Arrecadação de Doações de Itens Materiais.</p>
</footer>

</body>
</html>
